openapi: 3.2.0
info:
  title: Asaas Informações fiscais API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Informações fiscais
paths:
  /v3/fiscalInfo/:
    post:
      tags:
      - Informações fiscais
      summary: Criar e atualizar informações fiscais
      description: ''
      operationId: criar-e-atualizar-informacoes-fiscais
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FiscalInfoSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
    get:
      tags:
      - Informações fiscais
      summary: Recuperar informações fiscais
      description: ''
      operationId: recuperar-informacoes-fiscais
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/fiscalInfo/federalServiceCodes:
    get:
      tags:
      - Informações fiscais
      summary: Listar códigos de serviços federais
      description: ''
      operationId: listar-codigos-servicos-federais
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: code
        in: query
        description: Código tributário
        schema:
          type: string
          example: 040801
      - name: description
        in: query
        description: Descrição
        schema:
          type: string
          example: Terapia ocupacional
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoFederalServiceCodeListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/fiscalInfo/municipalOptions:
    get:
      tags:
      - Informações fiscais
      summary: Listar configurações municipais
      description: ''
      operationId: listar-configuracoes-municipais
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoMunicipalOptionsGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/fiscalInfo/nationalPortal:
    post:
      tags:
      - Informações fiscais
      summary: Configurar portal emissor de notas fiscais
      description: Aqui é possível habilitar ou desabilitar o uso do portal nacional como emissor de notas fiscais.
      operationId: configurar-portal-emissor-de-notas-fiscais
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiscalInfoUpdateUseNationalPortalRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoUpdateUseNationalPortalResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
  /v3/fiscalInfo/nbsCodes:
    get:
      tags:
      - Informações fiscais
      summary: Listar códigos NBS
      description: Listagem dos possíveis códigos NBS (Nomenclatura Brasileira de Serviços)
      operationId: listar-codigos-nbs
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: codeDescription
        in: query
        description: Código NBS e descrição
        schema:
          type: string
          example: 1.0101.11.00 - Serviços de construção de edificações residenciais de um e dois pavimentos
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoListInvoiceNbsCodesResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/fiscalInfo/operationIndicatorCodes:
    get:
      tags:
      - Informações fiscais
      summary: Listar códigos de indicadores de operações
      description: ''
      operationId: listar-codigos-de-operadores-de-indicacoes
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: code
        in: query
        description: Código do indicador da operação
        schema:
          type: string
          example: '020101'
      - name: description
        in: query
        description: Descrição
        schema:
          type: string
          example: Execução de operações com bem imóvel, bem imaterial, inclusive direito, relacionado a bem imóvel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoOperationIndicatorCodeListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/fiscalInfo/services:
    get:
      tags:
      - Informações fiscais
      summary: Listar serviços municipais
      description: ''
      operationId: listar-servicos-municipais
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: description
        in: query
        description: Nome do serviço
        schema:
          type: string
          example: '1.01'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoListMunicipalServicesResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/fiscalInfo/taxClassificationCodes:
    get:
      tags:
      - Informações fiscais
      summary: Listar códigos de classificações tributárias
      description: ''
      operationId: listar-codigos-de-classificacoes-tributarias
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: code
        in: query
        description: Código da classificação tributária
        schema:
          type: string
          example: '011001'
      - name: description
        in: query
        description: Descrição
        schema:
          type: string
          example: Situações tributadas integralmente pela IBS e pela CBS
      - name: taxSituationCode
        in: query
        description: Código da situação tributária
        schema:
          type: string
          example: '011'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoTaxClassificationCodeListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/fiscalInfo/taxSituationCodes:
    get:
      tags:
      - Informações fiscais
      summary: Listar códigos de situações tributárias
      description: ''
      operationId: listar-codigos-de-situacoes-tributarias
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: code
        in: query
        description: Código da situação tributária
        schema:
          type: string
          example: '200001'
      - name: description
        in: query
        description: Descrição
        schema:
          type: string
          example: Tributação com alíquotas uniformes reduzidas
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalInfoTaxSituationCodeListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
components:
  schemas:
    FiscalInfoMunicipalOptionsGetResponseDTO:
      type: object
      properties:
        authenticationType:
          $ref: '#/components/schemas/FiscalInfoMunicipalOptionsGetResponseEnotasTipoAutenticacao'
        supportsCancellation:
          type: boolean
          description: Suporta ou não o cancelamento de notas fiscais automaticamente na sua prefeitura
          example: true
          deprecated: false
          default: true
        usesSpecialTaxRegimes:
          type: boolean
          description: Necessário informar ou não o regime especial de tributação. Caso utilize, informe-o no campo `specialTaxRegime` do **Criar ou atualizar informações fiscais** de acordo com as opções retornadas na lista `specialTaxRegimesList`
          example: true
          deprecated: false
          default: true
        usesServiceListItem:
          type: boolean
          description: Necessário informar ou não o item da lista de serviço
          example: true
          deprecated: false
          default: true
        specialTaxRegimesList:
          type: array
          description: Opções de regime especial de tributação
          deprecated: false
          items:
            $ref: '#/components/schemas/FiscalInfoMunicipalOptionsSpecialTaxRegimesDTO'
        nationalPortalTaxCalculationRegimeList:
          type: array
          description: Opções de regime de apuração tributária pelo Simples Nacional
          deprecated: false
          items:
            $ref: '#/components/schemas/FiscalInfoMunicipalOptionsNationalPortalTaxCalculationRegimeDTO'
        nationalPortalTaxCalculationRegimeHelp:
          type: string
          description: Explicação sobre o regime de apuração tributária pelo Simples Nacional
          example: Isso identifica o regime de apuração tributária pelo Simples Nacional de sua empresa, se desejar deixar sem nenhuma opção marcada selecione a opção "Nenhum". Deve ser preenchido somente por empresas enquadradas como ME ou EPP optantes do Simples Nacional. Consulte a necessidade desta informação com a sua prefeitura ou a sua contabilidade.
          deprecated: false
        municipalInscriptionHelp:
          type: string
          description: Explicação sobre formato da inscrição municipal
          example: 'Informe somente os números sem ponto nem formatação (se contiver letras, insira sempre em maiúscula).


            Exemplos válidos: 4301000010 ou 131436001X'
          deprecated: false
        specialTaxRegimeHelp:
          type: string
          description: Explicação sobre o regime especial de tributação
          example: "Isso identifica o regime de tributação de sua empresa, se desejar deixar sem nenhuma opção marcada selecione o traço (\"-\").\n \n Empresas do simples nacional geralmente optam pelo ME ou ME EPP"
          deprecated: false
        serviceListItemHelp:
          type: string
          description: Explicação sobre formato do item da lista de serviço
          example: "Informe aqui o item da lista de serviço, é também um identificador do serviço prestado.\n \n Você precisa preencher o item da lista de serviço mantendo a formatação.\n Exemplos válidos: 17.02 ou 8.02"
          deprecated: false
        digitalCertificatedHelp:
          type: string
          description: Explicação sobre certificado digital
          example: Sua prefeitura exige a utilização de certificado digital, portanto, inclua aqui o arquivo de seu certificado A1.
          deprecated: false
        accessTokenHelp:
          type: string
          description: Explicação sobre token
          deprecated: false
          example: null
        municipalServiceCodeHelp:
          type: string
          description: Explicação sobre formato do código de serviço municipal
          example: "Informe aqui o código municipal que identifica o serviço prestado na nota fiscal. \nEm algumas cidades esse código é conhecido como código de tributação ou CTISS.\n\nExemplo válido: 010300388"
          deprecated: false
    File:
      type: string
      description: Arquivo
      format: binary
      deprecated: false
      example: null
    FiscalInfoMunicipalOptionsSpecialTaxRegimesDTO:
      type: object
      properties:
        label:
          type: string
          description: Nome do regime especial de tributação
          example: Microempresa Municipal
          deprecated: false
        value:
          type: string
          description: Identificador do regime especial de tributação
          example: '1'
          deprecated: false
      description: Opções de regime especial de tributação
      deprecated: false
    FiscalInfoListMunicipalServicesResponseDataDTO:
      type: object
      properties:
        id:
          type: string
          description: Identificador único do serviço
          example: '3544'
          deprecated: false
        description:
          type: string
          description: Descrição do serviço
          example: 1.01 - Análise e desenvolvimento de sistemas
          deprecated: false
        issTax:
          type: number
          description: Taxa percentual do ISS
          example: 0.5
          deprecated: false
      description: Lista de objetos
      example:
      - id: '3544'
        description: 1.01 - Análise e desenvolvimento de sistemas
        issTax: 5
      - id: '2360'
        description: 1.02 - Programação
        issTax: 3
      deprecated: false
    FiscalInfoListInvoiceNbsCodesResponseDTO:
      type: object
      properties:
        object:
          type: string
          description: Tipo de objeto
          example: list
          deprecated: false
        hasMore:
          type: boolean
          description: Indica se há mais uma página a ser buscada
          example: false
          deprecated: false
        totalCount:
          type: integer
          description: Quantidade total de itens para os filtros informados
          format: int32
          example: 2
          deprecated: false
        limit:
          type: integer
          description: Quantidade de objetos por página
          format: int32
          example: 10
          deprecated: false
        offset:
          type: integer
          description: Posição do objeto a partir do qual a página deve ser carregada
          format: int32
          example: 0
          deprecated: false
        data:
          type: array
          description: Lista de objetos
          example:
          - nbsCode: 1.0101.11.00
            codeDescription: 1.0101.11.00 - Serviços de construção de edificações residenciais de um e dois pavimentos
          - nbsCode: 1.0102.12.00
            codeDescription: 1.0102.12.00 - Serviços de construção de ferrovias
          deprecated: false
          items:
            $ref: '#/components/schemas/FiscalInfoListInvoiceNbsCodesResponseDataDTO'
    ErrorResponseItemDTO:
      type: object
      properties:
        code:
          type: string
          description: Código do erro
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição do erro
          deprecated: false
          example: null
      description: Lista de objetos
      deprecated: false
    FiscalInfoTaxSituationCodeResponseDTO:
      type: object
      properties:
        code:
          type: string
          description: Código da situação tributária
          example: '200001'
          deprecated: false
        description:
          type: string
          description: Descrição
          example: Tributação com alíquotas uniformes reduzidas
          deprecated: false
        isSubjectToIbsCbsTaxation:
          type: boolean
          description: Define se está sujeito à tributação IBS e CBS
          example: true
          deprecated: false
        isBaseReductionPercentApplicable:
          type: boolean
          description: Define se a porcentagem de redução da base é aplicável
          example: false
          deprecated: false
        isDefermentApplicable:
          type: boolean
          description: Define se aplica-se diferimento
          example: false
          deprecated: false
      description: Lista de objetos
      deprecated: false
    FiscalInfoListInvoiceNbsCodesResponseDataDTO:
      type: object
      properties:
        nbsCode:
          type: string
          description: Código NBS (Nomenclatura Brasileira de Serviços)
          example: 1.0101.11.00
          deprecated: false
        codeDescription:
          type: string
          description: Código NBS e descrição
          example: 1.0101.11.00 - Serviços de construção de edificações residenciais de um e dois pavimentos
          deprecated: false
      description: Lista de objetos
      example:
      - nbsCode: 1.0101.11.00
        codeDescription: 1.0101.11.00 - Serviços de construção de edificações residenciais de um e dois pavimentos
      - nbsCode: 1.0102.12.00
        codeDescription: 1.0102.12.00 - Serviços de construção de ferrovias
      deprecated: false
    FiscalInfoUpdateUseNationalPortalRequestDTO:
      required:
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Indica se a emissão de notas fiscais pelo portal nacional deve ser habilitada ou não.
          example: true
          deprecated: false
    FiscalInfoMunicipalOptionsNationalPortalTaxCalculationRegimeDTO:
      type: object
      properties:
        label:
          type: string
          description: Nome do regime de apuração tributária pelo Simples Nacional
          example: Regime de apuração dos tributos federais e municipal pelo SN
          deprecated: false
        value:
          type: string
          description: Identificador do regime de apuração tributária pelo Simples Nacional
          example: '0'
          deprecated: false
      description: Opções de regime de apuração tributária pelo Simples Nacional
      deprecated: false
    FiscalInfoFederalServiceCodeResponseDTO:
      type: object
      properties:
        code:
          type: string
          description: Código tributário
          example: 040801
          deprecated: false
        description:
          type: string
          description: Descrição
          example: Terapia ocupacional
          deprecated: false
      description: Lista de objetos
      deprecated: false
    FiscalInfoSaveRequestDTO:
      required:
      - email
      - simplesNacional
      type: object
      properties:
        email:
          type: string
          description: Email utilizado pelo Asaas para enviar notificações e alertas de notas fiscais
          example: john.doe@asaas.com.br
          deprecated: false
        municipalInscription:
          type: string
          description: Inscrição municipal da empresa
          example: '21779501'
          deprecated: false
        simplesNacional:
          type: boolean
          description: Indica se a empresa é optante pelo simples nacional
          example: false
          deprecated: false
          default: true
        culturalProjectsPromoter:
          type: boolean
          description: Identifica se a empresa é classificada como incentivador cultural
          example: false
          deprecated: false
          default: true
        cnae:
          type: string
          description: Código CNAE
          example: '6209100'
