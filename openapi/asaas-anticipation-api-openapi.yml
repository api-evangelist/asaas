openapi: 3.2.0
info:
  title: Asaas Anticipation API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Anticipation
paths:
  /v3/anticipations/simulate:
    post:
      tags:
      - Anticipation
      summary: Simulate anticipation
      description: ''
      operationId: simulate-anticipation
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnticipationSimulateRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnticipationSimulateResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Error description
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
components:
  schemas:
    ErrorResponseDTO:
      type: object
      properties:
        errors:
          type: array
          description: Lista de objetos
          deprecated: false
          items:
            $ref: '#/components/schemas/ErrorResponseItemDTO'
    AnticipationSimulateRequestDTO:
      type: object
      properties:
        installment:
          type: string
          description: ID of the installment to be anticipated
          deprecated: false
          example: null
        payment:
          type: string
          description: ID of the payment to be anticipated
          example: pay_626366773834
          deprecated: false
    ErrorResponseItemDTO:
      type: object
      properties:
        code:
          type: string
          description: Código do erro
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição do erro
          deprecated: false
          example: null
      description: Lista de objetos
      deprecated: false
    AnticipationSimulateResponseDTO:
      type: object
      properties:
        installment:
          type: string
          description: Unique identifier of the installment to be anticipated
          deprecated: false
          example: null
        payment:
          type: string
          description: Unique identifier of the payment to be anticipated
          example: pay_626366773834
          deprecated: false
        anticipationDate:
          type: string
          description: Anticipation request date
          format: date
          example: '2019-05-20'
          deprecated: false
        dueDate:
          type: string
          description: Request due date
          format: date
          example: '2019-05-26'
          deprecated: false
        fee:
          type: number
          description: Anticipation fee
          example: 2.33
          deprecated: false
        anticipationDays:
          type: integer
          description: Number of days that were anticipated
          format: int32
          example: 6
          deprecated: false
        netValue:
          type: number
          description: Net value discounted the anticipation fee
          example: 73.68
          deprecated: false
        totalValue:
          type: number
          description: Total amount of the payment to be anticipated
          example: 80
          deprecated: false
        value:
          type: number
          description: Anticipation value
          example: 76.01
          deprecated: false
        isDocumentationRequired:
          type: boolean
          description: Determines the obligation to send electronic invoices or service provision contracts when requesting anticipation payment
          example: false
          deprecated: false
  securitySchemes:
    Authorization:
      type: apiKey
      name: access_token
      in: header
