openapi: 3.2.0
info:
  title: Asaas Parcelamentos API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Parcelamentos
paths:
  /v3/installments:
    post:
      tags:
      - Parcelamentos
      summary: Criar parcelamento
      description: ''
      operationId: criar-parcelamento
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_object
                  description: Informe o número de parcelas.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
    get:
      tags:
      - Parcelamentos
      summary: Listar parcelamentos
      description: ''
      operationId: listar-parcelamentos
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/installments/{id}:
    get:
      tags:
      - Parcelamentos
      summary: Recuperar um único parcelamento
      description: ''
      operationId: recuperar-um-unico-parcelamento
      parameters:
      - name: id
        in: path
        description: Identificador único do parcelamento no Asaas
        required: true
        schema:
          type: string
          example: 2765d086-c7c5-5cca-898a-4262d212587c
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
    delete:
      tags:
      - Parcelamentos
      summary: Remover parcelamento
      description: ''
      operationId: remover-parcelamento
      parameters:
      - name: id
        in: path
        description: Identificador único do parcelamento a ser removido.
        required: true
        schema:
          type: string
          example: 5a2c890b-dd63-4b5a-9169-96c8d7828f4c
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentDeleteResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/installments/{id}/paymentBook:
    get:
      tags:
      - Parcelamentos
      summary: Gerar carnê de parcelamento
      description: ''
      operationId: gerar-carne-de-parcelamento
      parameters:
      - name: id
        in: path
        description: Identificador único do parcelamento no Asaas
        required: true
        schema:
          type: string
          example: 2765d086-c7c5-5cca-898a-4262d212587c
      - name: sort
        in: query
        description: Filtrar pelo nome da coluna
        schema:
          type: string
          example: null
      - name: order
        in: query
        description: Ordenação da coluna
        schema:
          type: string
          example: asc
      responses:
        '200':
          description: Ok
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                example: Binário do carnê do parcelamento
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
  /v3/installments/{id}/payments:
    delete:
      tags:
      - Parcelamentos
      summary: Cancelar cobranças de um parcelamento (pendentes e vencidas)
      description: ''
      operationId: cancelar-cobrancas-de-um-parcelamento
      parameters:
      - name: id
        in: path
        description: Identificador único do parcelamento que terá cobranças removidas.
        required: true
        schema:
          type: string
          example: 5a2c890b-dd63-4b5a-9169-96c8d7828f4c
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentDeletePaymentsResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/installments/{id}/refund:
    post:
      tags:
      - Parcelamentos
      summary: Estornar parcelamento
      description: 'É possível estornar um parcelamento via cartão de crédito recebido ou confirmado.


        Como já ocorre no processo de estorno de uma cobrança avulsa por cartão de crédito, o saldo correspondente do parcelamento é debitado de sua conta no Asaas e a cobrança é cancelada no cartão do seu cliente. O cancelamento pode levar até 10 dias úteis para aparecer na fatura de seu cliente.'
      operationId: estornar-parcelamento
      parameters:
      - name: id
        in: path
        description: Identificador único do parcelamento a ser estornado.
        required: true
        schema:
          type: string
          example: 2765d086-c7c5-5cca-898a-4262d212587c
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentRefundRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/installments/{id}/splits:
    put:
      tags:
      - Parcelamentos
      summary: Atualizar splits do parcelamento
      description: ''
      operationId: atualizar-splits-do-parcelamento
      parameters:
      - name: id
        in: path
        description: ID do parcelamento
        required: true
        schema:
          type: string
          example: 2765d086-c7c5-5cca-898a-4262d212587c
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentUpdateSplitRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentUpdateSplitResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
components:
  schemas:
    PaymentChargebackResponseChargebackReason:
      type: string
      description: Razão do chargeback
      example: COMMERCIAL_DISAGREEMENT
      deprecated: false
      enum:
      - ABSENCE_OF_PRINT
      - ABSENT_CARD_FRAUD
      - CARD_ACTIVATED_PHONE_TRANSACTION
      - CARD_FRAUD
      - CARD_RECOVERY_BULLETIN
      - COMMERCIAL_DISAGREEMENT
      - COPY_NOT_RECEIVED
      - CREDIT_OR_DEBIT_PRESENTATION_ERROR
      - DIFFERENT_PAY_METHOD
      - FRAUD
      - INCORRECT_TRANSACTION_VALUE
      - INVALID_CURRENCY
      - INVALID_DATA
      - LATE_PRESENTATION
      - LOCAL_REGULATORY_OR_LEGAL_DISPUTE
      - MULTIPLE_ROCS
      - ORIGINAL_CREDIT_TRANSACTION_NOT_ACCEPTED
      - OTHER_ABSENT_CARD_FRAUD
      - PROCESS_ERROR
      - RECEIVED_COPY_ILLEGIBLE_OR_INCOMPLETE
      - RECURRENCE_CANCELED
      - REQUIRED_AUTHORIZATION_NOT_GRANTED
      - RIGHT_OF_FULL_RECOURSE_FOR_FRAUD
      - SALE_CANCELED
      - SERVICE_DISAGREEMENT_OR_DEFECTIVE_PRODUCT
      - SERVICE_NOT_RECEIVED
      - SPLIT_SALE
      - TRANSFERS_OF_DIVERSE_RESPONSIBILITIES
      - UNQUALIFIED_CAR_RENTAL_DEBIT
      - USA_CARDHOLDER_DISPUTE
      - VISA_FRAUD_MONITORING_PROGRAM
      - WARNING_BULLETIN_FILE
    InstallmentSplitGetResponsePaymentSplitStatus:
      type: string
      description: Status do split
      example: PENDING
      deprecated: false
      enum:
      - PENDING
      - PROCESSING
      - PROCESSING_REFUND
      - AWAITING_CREDIT
      - CANCELLED
      - DONE
      - REFUNDED
      - BLOCKED_BY_VALUE_DIVERGENCE
    PaymentDiscountDiscountType:
      type: string
      description: Tipo de desconto
      example: PERCENTAGE
      deprecated: false
      enum:
      - FIXED
      - PERCENTAGE
    PaymentDiscountDTO:
      type: object
      properties:
        value:
          type: number
          description: Valor percentual ou fixo de desconto a ser aplicado sobre o valor da cobrança
          example: 10
          deprecated: false
        dueDateLimitDays:
          type: integer
          description: 'Dias antes do vencimento para aplicar desconto. Ex: 0 = até o vencimento, 1 = até um dia antes, 2 = até dois dias antes, e assim por diante'
          format: int32
          example: 0
          deprecated: false
        type:
          $ref: '#/components/schemas/PaymentDiscountDiscountType'
      description: Informações de desconto
      deprecated: false
    PaymentChargebackResponseChargebackDisputeStatus:
      type: string
      description: Status da disputa do chargeback.
      example: ACCEPTED
      deprecated: false
      enum:
      - REQUESTED
      - ACCEPTED
      - REJECTED
    InstallmentUpdateSplitRequestDTO:
      type: object
      properties:
        splits:
          type: array
          description: Dados de split para atualizar
          deprecated: false
          items:
            $ref: '#/components/schemas/InstallmentSplitRequestDTO'
    InstallmentSplitGetResponsePaymentSplitCancellationReason:
      type: string
      description: Motivo de cancelamento do split
      example: BANK_ACCOUNT_AWAITING_AUTHORIZATION
      deprecated: false
      enum:
      - BANK_ACCOUNT_AWAITING_AUTHORIZATION
      - BANK_ACCOUNT_PENDING
      - BANK_ACCOUNT_REJECTED
      - CHECKOUT_VALIDATION_FAILED
      - CUSTOMER_DOCUMENTS_PENDING
      - CUSTOMER_DOCUMENTS_REJECTED
      - EXTERNAL_AUTHORIZATION_REFUSED
      - MANUAL_CANCELLATION
      - PAYMENT_DELETED
      - PAYMENT_OVERDUE
      - PAYMENT_RECEIVED_IN_CASH
      - PAYMENT_REFUNDED
      - VALUE_DIVERGENCE_BLOCK
      - WALLET_REMOVED_FROM_OUTSIDE_ARRANGEMENT_ALLOW_LIST
      - WALLET_UNABLE_TO_RECEIVE
    ErrorResponseItemDTO:
      type: object
      properties:
        code:
          type: string
          description: Código do erro
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição do erro
          deprecated: false
          example: null
      description: Lista de objetos
      deprecated: false
    ChargebackCreditCardResponseDTO:
      type: object
      properties:
        number:
          type: string
          description: Últimos 4 dígitos do cartão utilizado
          example: '8829'
          deprecated: false
        brand:
          $ref: '#/components/schemas/ChargebackCreditCardResponseCreditCardBrand'
      description: Informações do cartão de crédito
      deprecated: false
    InstallmentSaveRequestDTO:
      required:
      - installmentCount
      - customer
      - value
      - billingType
      - dueDate
      type: object
      properties:
        installmentCount:
          type: integer
          description: Número de parcelas
          format: int32
          example: 3
          deprecated: false
        customer:
          type: string
          description: Identificador único do cliente no Asaas
          example: cus_G7Dvo4iphUNk
          deprecated: false
        value:
          type: number
          description: Valor de cada parcela
          example: 100
          deprecated: false
        totalValue:
          type: number
          description: Valor total do parcelamento
          example: 150
          deprecated: false
        billingType:
          $ref: '#/components/schemas/InstallmentSaveRequestBillingType'
        dueDate:
          type: string
          description: Data de vencimento da primeira parcela
          format: date
          example: '2025-07-08'
          deprecated: false
        description:
          type: string
          description: Descrição do parcelamento (máx. 500 caracteres)
          example: Parcelamento 08652
          deprecated: false
        postalService:
          type: boolean
          description: Define se a cobrança será enviada via Correios
          example: false
          deprecated: false
        daysAfterDueDateToRegistrationCancellation:
          type: integer
          description: Dias após o vencimento para cancelamento do registro (somente para boleto bancário)
          format: int32
          example: 1
          deprecated: false
        paymentExternalReference:
          type: string
          description: Campo livre para busca
          example: 056984
          deprecated: false
        discount:
          $ref: '#/components/schemas/PaymentDiscountDTO'
        interest:
          $ref: '#/components/schemas/PaymentInterestRequestDTO'
        fine:
          $ref: '#/components/schemas/PaymentFineRequestDTO'
        splits:
          type: array
          description: Configurações do split
          deprecated: false
          items:
            $ref: '#/components/schemas/InstallmentSplitRequestDTO'
    PaymentFineRequestDTO:
      type: object
      properties:
        value:
          type: number
          description: Percentual de multa sobre o valor da cobrança para pagamento após o vencimento
          deprecated: false
          example: null
        type:
          $ref: '#/components/schemas/PaymentFineRequestFineType'
      description: Informações de multa para pagamento após o vencimento
      deprecated: false
    InstallmentRefundRequestDTO:
      type: object
      properties:
        value:
          type: number
          description: Valor total a ser estornado
          example: 5
          deprecated: false
    InstallmentGetResponseDTO:
      type: object
      properties:
        object:
          type: string
          description: Tipo do objeto
          example: installment
          deprecated: false
        id:
          type: string
          description: Identificador único do parcelamento no Asaas
          example: 2765d086-c7c5-5cca-898a-4262d212587c
          deprecated: false
        value:
          type: number
          description: Valor do parcelamento
          example: 360
          deprecated: false
        netValue:
          type: number
          description: Valor líquido do parcelamento
          example: 312.12
          deprecated: false
        paymentValue:
          type: number
          description: Valor de cada parcela
          example: 30
          deprecated: false
        installmentCount:
          type: integer
          description: Número de parcelas
          format: int32
          example: 12
          deprecated: false
        billingType:
          $ref: '#/components/schemas/InstallmentGetResponseBillingType'
        paymentDate:
          type: string
          description: Data de liquidação da cobrança no Asaas
          format: date
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição do parcelamento
          example: Pedido 056984
          deprecated: false
        expirationDay:
          type: integer
          description: Data de vencimento de cada parcela
          format: int32
          example: 31
          deprecated: false
        dateCreated:
          type: string
          description: Data de criação do parcelamento
          format: date
          example: '2021-01-19'
          deprecated: false
        customer:
          type: string
          description: Identificador único do cliente ao qual o parcelamento pertence
          example: cus_000000001645
          deprecated: false
        paymentLink:
          type: string
          description: Identificador único do link de pagamentos ao qual o parcelamento pertence
          example: '997152082166122'
          deprecated: false
        checkoutSession:
          type: string
          description: Identificador único do checkout
          example: 5a3e564f-81cd-4f4e-9c8e-af43f9ac4287
          deprecated: false
        transactionReceiptUrl:
          type: string
          description: URL do comprovante de confirmação, recebimento, estorno ou remoção.
          deprecated: false
          example: null
        chargeback:
          $ref: '#/components/schemas/PaymentChargebackResponseDTO'
        creditCard:
          $ref: '#/components/schemas/PaymentSaveWithCreditCardCreditCardDTO'
        deleted:
          type: boolean
          description: Indica se o parcelamento foi removido
          example: false
          deprecated: false
        refunds:
          type: array
          description: Informações de estorno
          deprecated: false
          items:
            $ref: '#/components/schemas/InstallmentRefundResponseDTO'
        threeDSecureChallengeUrl:
          type: string
          description: URL para onde o titular do cartão deve ser redirecionado para concluir o desafio de autenticação 3D Secure. Retornado apenas quando o desafio de autenticação é exigido pelo emissor do cartão
          deprecated: false
          example: null
    PaymentFineRequestFineType:
      type: string
      description: Tipo de multa
      example: FIXED
      deprecated: false
      enum:
      - FIXED
      - PERCENTAGE
    PaymentRefundedSplitResponseDTO:
      type: object
      properties:
        id:
          type: string
          description: Identificador único do split
          example: cff860dd-148e-48ca-ac8e-849684175158
          deprecated: false
        value:
          type: number
          description: Valor estornado
          example: 10
          deprecated: false
        done:
          type: boolean
          description: Indica se o split foi estornado
          example: true
          deprecated: false
      description: Lista de splits estornados, se houver
      deprecated: false
    InstallmentRefundResponseDTO:
      type: object
      properties:
        dateCreated:
          type: string
          description: Data da criação do estorno
          format: date-time
          example: '2024-10-18 10:19:06'
          deprecated: false
        status:
          $ref: '#/components/schemas/InstallmentRefundResponsePaymentRefundStatus'
        value:
          type: number
          description: Valor do estorno
          example: 40
          deprecated: false
        endToEndIdentifier:
          type: string
          description: (Apenas pix) Identificador da transação Pix no Banco Central
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição do estorno
          deprecated: false
          example: null
        effectiveDate:
          type: string
          description: (Apenas pix) Data de efetivação do estorno
          format: date-time
          example: '2024-10-19 10:19:06'
          deprecated: false
        transactionReceiptUrl:
          type: string
          description: Link do recibo da transação
          deprecated: false
          example: null
        refundedSplits:
          type: array
          description: Lista de splits estornados, se houver
          deprecated: false
          items:
            $ref: '#/components/schemas/PaymentRefundedSplitResponseDTO'
        paymentId:
          type: string
          description: Identificador único da cobrança no Asaas
          example: pay_080225913252
          deprecated: false
      description: Informações de estorno
      deprecated: false
    InstallmentGetResponseBillingType:
      type: string
      description: Forma de pagamento
      example: CREDIT_CARD
      deprecated: false
      enum:
      - UNDEFINED
      - BOLETO
      - CREDIT_CARD
      - DEBIT_CARD
      - TRANSFER
      - DEPOSIT
      - PIX
    PaymentSaveWithCreditCardCreditCardDTO:
      type: object
      properties:
        creditCardNumber:
          type: string
          description: Últimos 4 dígitos do cartão utilizado
          example: '8829'
          deprecated: false
        creditCardBrand:
          $ref: '#/components/schemas/PaymentSaveWithCreditCardCreditCardCreditCardBrand'
        creditCardToken:
          type: string
          description: Token do cartão de crédito caso a tokenização esteja ativa.
          deprecated: false
          example: null
      description: Informações do cartão de crédito
      deprecated: false
    InstallmentListResponseDTO:
      type: object
      properties:
        object:
          type: string
          description: Tipo de objeto
          example: list
          deprecated: false
        hasMore:
          type: boolean
          description: Indica se há mais uma página a ser buscada
          example: false
          deprecated: false
        totalCount:
          type: integer
          description: Quantidade total de itens para os filtros informados
          format: int32
          example: 2
          deprecated: false
        limit:
          type: integer
          description: Quantidade de objetos por página
          format: int32
          example: 10
          deprecated: false
        offset:
          type: integer
          description: Posição do objeto a partir do qual a página deve ser carregada
          format: int32
          example: 0
          deprecated: false
        data:
          type: array
          description: Lista de objetos
          deprecated: false
          items:
            $ref: '#/components/schemas/InstallmentGetResponseDTO'
    InstallmentSplitRequestDTO:
      required:
      - walletId
      type: object
      properties:
        walletId:
