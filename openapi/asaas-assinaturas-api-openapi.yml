openapi: 3.2.0
info:
  title: Asaas Assinaturas API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Assinaturas
paths:
  /v3/subscriptions:
    post:
      tags:
      - Assinaturas
      summary: Criar nova assinatura
      description: ''
      operationId: criar-nova-assinatura
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
    get:
      tags:
      - Assinaturas
      summary: Listar assinaturas
      description: ''
      operationId: listar-assinaturas
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: customer
        in: query
        description: Filtrar pelo Identificador único do cliente
        schema:
          type: string
          example: null
      - name: customerGroupName
        in: query
        description: Filtrar pelo nome do grupo de cliente
        schema:
          type: string
          example: null
      - name: billingType
        in: query
        description: Filtrar por forma de pagamento
        schema:
          $ref: '#/components/schemas/SubscriptionListRequestBillingType'
      - name: status
        in: query
        description: Filtrar pelo status
        schema:
          $ref: '#/components/schemas/SubscriptionListRequestSubscriptionStatus'
      - name: deletedOnly
        in: query
        description: Envie true para retornar somente as assinaturas removidas
        schema:
          type: string
          example: null
      - name: includeDeleted
        in: query
        description: Envie true para recuperar também as assinaturas removidas
        schema:
          type: string
          example: null
      - name: externalReference
        in: query
        description: Filtrar pelo Identificador do seu sistema
        schema:
          type: string
          example: null
      - name: order
        in: query
        description: Ordem crescente ou decrescente
        schema:
          type: string
          example: null
      - name: sort
        in: query
        description: Por qual campo será ordenado
        schema:
          type: string
          example: null
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/subscriptions/:
    post:
      tags:
      - Assinaturas
      summary: Criar assinatura com cartão de crédito
      description: ''
      operationId: criar-assinatura-com-cartao-de-credito
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionSaveWithCreditCardRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSaveWithCreditCardResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
  /v3/subscriptions/{id}:
    get:
      tags:
      - Assinaturas
      summary: Recuperar uma única assinatura
      description: ''
      operationId: recuperar-uma-unica-assinatura
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
    put:
      tags:
      - Assinaturas
      summary: Atualizar assinatura existente
      description: ''
      operationId: atualizar-assinatura-existente
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
    delete:
      tags:
      - Assinaturas
      summary: Remover assinatura
      description: ''
      operationId: remover-assinatura
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDeleteResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/subscriptions/{id}/invoiceSettings:
    post:
      tags:
      - Assinaturas
      summary: Criar configuração para emissão de Notas Fiscais
      description: ''
      operationId: criar-configuracao-para-emissao-de-notas-fiscais
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionConfigureInvoiceRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInvoiceConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
    get:
      tags:
      - Assinaturas
      summary: Recuperar configuração para emissão de notas fiscais
      description: ''
      operationId: recuperar-configuracao-para-emissao-de-notas-fiscais
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInvoiceConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
    delete:
      tags:
      - Assinaturas
      summary: Remover configuração para emissão de Notas Fiscais
      description: ''
      operationId: remover-configuracao-para-emissao-de-notas-fiscais
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDeleteInvoiceConfigResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
    put:
      tags:
      - Assinaturas
      summary: Atualizar configuração para emissão de Notas Fiscais
      description: ''
      operationId: atualizar-configuracao-para-emissao-de-notas-fiscais
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInvoiceConfigUpdateRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInvoiceConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/subscriptions/{id}/invoices:
    get:
      tags:
      - Assinaturas
      summary: Listar notas fiscais das cobranças de uma assinatura
      description: ''
      operationId: listar-notas-fiscais-das-cobrancas-de-uma-assinatura
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: inv_000000000232
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: effectiveDate[ge]
        in: query
        description: Filtrar a partir de uma data de emissão
        schema:
          type: string
          example: '2024-08-20'
      - name: effectiveDate[le]
        in: query
        description: Filtrar até uma data de emissão
        schema:
          type: string
          example: '2024-08-20'
      - name: externalReference
        in: query
        description: Identificador da nota fiscal no seu sistema
        schema:
          type: string
          example: null
      - name: status
        in: query
        description: Filtrar por status da nota fiscal
        schema:
          $ref: '#/components/schemas/SubscriptionGetInvoicesRequestInvoiceStatus'
      - name: customer
        in: query
        description: Filtrar pelo identificador único do cliente
        schema:
          type: string
          example: cus_000000002750
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
  /v3/subscriptions/{id}/paymentBook:
    get:
      tags:
      - Assinaturas
      summary: Gerar carnê de assinatura
      description: ''
      operationId: gerar-carne-de-assinatura
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      - name: month
        in: query
        description: Mês final para geração do carnê
        schema:
          type: integer
          example: null
      - name: year
        in: query
        description: Ano final para geração do carnê
        schema:
          type: integer
          example: null
      - name: sort
        in: query
        description: Filtrar pelo nome da coluna
        schema:
          type: string
          example: null
      - name: order
        in: query
        description: Ordenação da coluna
        schema:
          type: string
          example: asc
      responses:
        '200':
          description: Ok
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                example: Binário do carnê da assinatura
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
  /v3/subscriptions/{id}/payments:
    get:
      tags:
      - Assinaturas
      summary: Listar cobranças de uma assinatura
      description: ''
      operationId: listar-cobrancas-de-uma-assinatura
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      - name: status
        in: query
        description: Filtrar por status das cobranças
        schema:
          $ref: '#/components/schemas/SubscriptionListPaymentsRequestPaymentStatus'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
  /v3/subscriptions/{id}/updateCreditCard:
    post:
      tags:
      - Assinaturas
      summary: Atualiza o cartão de crédito sem efetuar cobrança
      description: Este endpoint atualiza o cartão de crédito da assinatura sem realizar a cobrança imediata. Além disso, todas as cobranças pendentes vinculadas a assinatura também são atualizadas.
      operationId: atualizar-cartao-de-credito-assinatura
      parameters:
      - name: id
        in: path
        description: Identificador único da assinatura no Asaas
        required: true
        schema:
          type: string
          example: sub_VXJBYgP2u0eO
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateCreditCardRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
components:
  schemas:
    PaymentChargebackResponseChargebackReason:
      type: string
      description: Razão do chargeback
      example: COMMERCIAL_DISAGREEMENT
      deprecated: false
      enum:
      - ABSENCE_OF_PRINT
      - ABSENT_CARD_FRAUD
      - CARD_ACTIVATED_PHONE_TRANSACTION
      - CARD_FRAUD
      - CARD_RECOVERY_BULLETIN
      - COMMERCIAL_DISAGREEMENT
      - COPY_NOT_RECEIVED
      - CREDIT_OR_DEBIT_PRESENTATION_ERROR
      - DIFFERENT_PAY_METHOD
      - FRAUD
      - INCORRECT_TRANSACTION_VALUE
      - INVALID_CURRENCY
      - INVALID_DATA
      - LATE_PRESENTATION
      - LOCAL_REGULATORY_OR_LEGAL_DISPUTE
      - MULTIPLE_ROCS
      - ORIGINAL_CREDIT_TRANSACTION_NOT_ACCEPTED
      - OTHER_ABSENT_CARD_FRAUD
      - PROCESS_ERROR
      - RECEIVED_COPY_ILLEGIBLE_OR_INCOMPLETE
      - RECURRENCE_CANCELED
      - REQUIRED_AUTHORIZATION_NOT_GRANTED
      - RIGHT_OF_FULL_RECOURSE_FOR_FRAUD
      - SALE_CANCELED
      - SERVICE_DISAGREEMENT_OR_DEFECTIVE_PRODUCT
      - SERVICE_NOT_RECEIVED
      - SPLIT_SALE
      - TRANSFERS_OF_DIVERSE_RESPONSIBILITIES
      - UNQUALIFIED_CAR_RENTAL_DEBIT
      - USA_CARDHOLDER_DISPUTE
      - VISA_FRAUD_MONITORING_PROGRAM
      - WARNING_BULLETIN_FILE
    SubscriptionUpdateRequestSubscriptionStatus:
      type: string
      description: Status da assinatura
      example: ACTIVE
      deprecated: false
      enum:
      - ACTIVE
      - INACTIVE
    SubscriptionGetInvoicesRequestInvoiceStatus:
      type: string
      description: Filtrar por status da nota fiscal
      example: SCHEDULED
      deprecated: false
      enum:
      - SCHEDULED
      - WAITING_OVERDUE_PAYMENT
      - PENDING
      - SYNCHRONIZED
      - AUTHORIZED
      - PROCESSING_CANCELLATION
      - CANCELLED
      - CANCELLATION_DENIED
      - ERROR
      - NONE
      - CANCELED
    SubscriptionSaveRequestCycle:
      type: string
      description: Periodicidade da cobrança
      example: MONTHLY
      deprecated: false
      enum:
      - WEEKLY
      - BIWEEKLY
      - MONTHLY
      - BIMONTHLY
      - QUARTERLY
      - SEMIANNUALLY
      - YEARLY
    SubscriptionListPaymentsRequestPaymentStatus:
      type: string
      description: Filtrar por status das cobranças
      example: PENDING
      deprecated: false
      enum:
      - PENDING
      - RECEIVED
      - CONFIRMED
      - OVERDUE
      - REFUNDED
      - RECEIVED_IN_CASH
      - REFUND_REQUESTED
      - REFUND_IN_PROGRESS
      - CHARGEBACK_REQUESTED
      - CHARGEBACK_DISPUTE
      - AWAITING_CHARGEBACK_REVERSAL
      - DUNNING_REQUESTED
      - DUNNING_RECEIVED
      - AWAITING_RISK_ANALYSIS
    PaymentDiscountDiscountType:
      type: string
      description: Tipo de desconto
      example: PERCENTAGE
      deprecated: false
      enum:
      - FIXED
      - PERCENTAGE
    PaymentInterestResponseDTO:
      type: object
      properties:
        value:
          type: number
          description: Valor dos juros em porcentagem
          example: 2
          deprecated: false
      description: Informações de juros para pagamento após o vencimento
      deprecated: false
    CreditCardRequestDTO:
      required:
      - holderName
      - number
      - expiryMonth
      - expiryYear
      - ccv
      type: object
      properties:
        holderName:
          type: string
          description: Nome impresso no cartão
          example: John Doe
          deprecated: false
        number:
          type: string
