openapi: 3.2.0
info:
  title: Asaas Informações e personalização da conta API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Informações e personalização da conta
paths:
  /v3/myAccount/:
    delete:
      tags:
      - Informações e personalização da conta
      summary: Excluir subconta White Label
      description: ''
      operationId: excluir-subconta-white-label
      parameters:
      - name: removeReason
        in: query
        description: Motivo da remoção
        schema:
          type: string
          example: Liberar dados
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccountDisableAccountResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
  /v3/myAccount/accountNumber:
    get:
      tags:
      - Informações e personalização da conta
      summary: Recuperar número de conta no Asaas
      description: ''
      operationId: recuperar-numero-de-conta-no-asaas
      parameters: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccountGetAccountNumberResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/myAccount/commercialInfo/:
    get:
      tags:
      - Informações e personalização da conta
      summary: Recuperar dados comerciais
      description: ''
      operationId: recuperar-dados-comerciais
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfoGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
    post:
      tags:
      - Informações e personalização da conta
      summary: Atualizar dados comerciais
      description: ''
      operationId: atualizar-dados-comerciais
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInfoSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfoGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
  /v3/myAccount/fees/:
    get:
      tags:
      - Informações e personalização da conta
      summary: Recuperar taxas da conta
      description: ''
      operationId: recuperar-taxas-da-conta
      parameters: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccountGetAccountFeesResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/myAccount/paymentCheckoutConfig/:
    post:
      tags:
      - Informações e personalização da conta
      summary: Salvar personalização da fatura
      description: ''
      operationId: salvar-personalizacao-da-fatura
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCheckoutConfigSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckoutConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
    get:
      tags:
      - Informações e personalização da conta
      summary: Recuperar configurações de personalização
      description: ''
      operationId: recuperar-configuracoes-de-personalizacao
      parameters: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckoutConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/myAccount/status/:
    get:
      tags:
      - Informações e personalização da conta
      summary: Consultar situação cadastral da conta
      description: ''
      operationId: consultar-situacao-cadastral-da-conta
      parameters: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccountGetStatusResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/wallets/:
    get:
      tags:
      - Informações e personalização da conta
      summary: Recuperar WalletId
      description: ''
      operationId: recuperar-walletid
      parameters: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletShowResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
components:
  schemas:
    WalletShowResponseDTO:
      type: object
      properties:
        object:
          type: string
          description: Tipo de objeto
          example: list
          deprecated: false
        hasMore:
          type: boolean
          description: Indica se há mais uma página a ser buscada
          example: false
          deprecated: false
        totalCount:
          type: integer
          description: Quantidade total de itens para os filtros informados
          format: int32
          example: 2
          deprecated: false
        limit:
          type: integer
          description: Quantidade de objetos por página
          format: int32
          example: 10
          deprecated: false
        offset:
          type: integer
          description: Posição do objeto a partir do qual a página deve ser carregada
          format: int32
          example: 0
          deprecated: false
        data:
          type: array
          description: Lista de objetos
          deprecated: false
          items:
            $ref: '#/components/schemas/WalletGetResponseDTO'
    File:
      type: string
      description: Arquivo
      format: binary
      deprecated: false
      example: null
    AccountInfoCommercialInfoExpirationResponseDTO:
      type: object
      properties:
        isExpired:
          type: boolean
          description: Informa se os dados comerciais estão expirados
          example: false
          deprecated: false
        scheduledDate:
          type: string
          description: Informa a data de expiração dos dados comerciais
          format: date-time
          example: '2025-05-05 00:00:00'
          deprecated: false
      description: Informações sobre a expiração dos dados comerciais
      deprecated: false
    MyAccountDisableAccountResponseDTO:
      type: object
      properties:
        observations:
          type: string
          description: Informações sobre a exclusão
          example: Conta desabilitada com sucesso
          deprecated: false
    MyAccountGetAccountFeesAnticipationCreditCardDTO:
      type: object
      properties:
        detachedMonthlyFeeValue:
          type: number
          description: Taxa ao mês para cobranças à vista
          example: 2.49
          deprecated: false
        installmentMonthlyFeeValue:
          type: integer
          description: Taxa ao mês para cobranças parceladas
          format: int32
          example: 2
          deprecated: false
      description: Tarifa de antecipações em cartão de crédito
      deprecated: false
    ErrorResponseItemDTO:
      type: object
      properties:
        code:
          type: string
          description: Código do erro
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição do erro
          deprecated: false
          example: null
      description: Lista de objetos
      deprecated: false
    MyAccountGetAccountFeesTransferPixDTO:
      type: object
      properties:
        feeValue:
          type: number
          description: Taxa por envio de transferências via Pix
          example: 5
          deprecated: false
        discountValue:
          type: number
          description: Taxa promocional (Se houver)
          deprecated: false
          example: null
        expirationDate:
          type: string
          description: Data de expiração da taxa promocional (Se houver)
          format: date-time
          deprecated: false
          example: null
        consideredInMonthlyTransfersWithoutFee:
          type: boolean
          description: Indica se a quantidade de transações grátis mensais considera Pix
          example: true
          deprecated: false
      description: Taxas para transferências Pix
      deprecated: false
    MyAccountGetStatusResponseDTO:
      type: object
      properties:
        id:
          type: string
          description: Identificador único da conta no Asaas
          example: a910f50b-8745-4bc6-89fe-f1931c6a2e05
          deprecated: false
        commercialInfo:
          $ref: '#/components/schemas/MyAccountGetStatusResponseStatus'
        bankAccountInfo:
          $ref: '#/components/schemas/MyAccountGetStatusResponseStatus'
        documentation:
          $ref: '#/components/schemas/MyAccountGetStatusResponseStatus'
        general:
          $ref: '#/components/schemas/MyAccountGetStatusResponseStatus'
    AccountInfoCityState:
      type: string
      description: Sigla do Estado (SP, RJ, SC, ...)
      example: SC
      deprecated: false
      enum:
      - AC
      - AL
      - AP
      - AM
      - BA
      - CE
      - DF
      - ES
      - GO
      - MA
      - MT
      - MS
      - MG
      - PA
      - PB
      - PR
      - PE
      - PI
      - RR
      - RO
      - RJ
      - RN
      - RS
      - SC
      - SP
      - SE
      - TO
    AccountInfoSaveRequestCompanyType:
      type: string
      description: Tipo da empresa (somente quando Pessoa Jurídica)
      example: MEI
      deprecated: false
      enum:
      - MEI
      - LIMITED
      - INDIVIDUAL
      - ASSOCIATION
    AccountInfoSaveRequestPersonType:
      type: string
      description: Tipo de Pessoa
      example: JURIDICA
      deprecated: false
      enum:
      - JURIDICA
      - FISICA
    WalletGetResponseDTO:
      type: object
      properties:
        object:
          type: string
          description: Tipo de objeto
          example: wallet
          deprecated: false
        id:
          type: string
          description: Identificador da carteira
          example: 0000c712-0a0b-a0b0-0000-031e7ac51a2
          deprecated: false
      description: Lista de objetos
      deprecated: false
    MyAccountGetAccountFeesCreditBureauReportDTO:
      type: object
      properties:
        naturalPersonFeeValue:
          type: number
          description: Taxa por consulta Serasa de pessoa física
          example: 16.99
          deprecated: false
        legalPersonFeeValue:
          type: number
          description: Taxa por consulta Serasa de pessoa jurídica
          example: 16.99
          deprecated: false
      description: Taxas de consulta Serasa
      deprecated: false
    MyAccountGetAccountFeesResponseDTO:
      type: object
      properties:
        payment:
          $ref: '#/components/schemas/MyAccountGetAccountFeesPaymentDTO'
        transfer:
          $ref: '#/components/schemas/MyAccountGetAccountFeesTransferDTO'
        notification:
          $ref: '#/components/schemas/MyAccountGetAccountFeesNotificationDTO'
        creditBureauReport:
          $ref: '#/components/schemas/MyAccountGetAccountFeesCreditBureauReportDTO'
        paymentDunning:
          $ref: '#/components/schemas/MyAccountGetAccountFeesPaymentDunningDTO'
        invoice:
          $ref: '#/components/schemas/MyAccountGetAccountFeesInvoiceDTO'
        anticipation:
          $ref: '#/components/schemas/MyAccountGetAccountFeesAnticipationDTO'
    AccountInfoGetResponsePersonType:
      type: string
      description: Tipo de Pessoa
      example: JURIDICA
      deprecated: false
      enum:
      - JURIDICA
      - FISICA
    PaymentCheckoutConfigGetResponseInvoiceConfigStatus:
      type: string
      description: Situação da personalização da fatura
      example: APPROVED
      deprecated: false
      enum:
      - AWAITING_APPROVAL
      - APPROVED
      - REJECTED
    MyAccountGetAccountFeesTransferTedDTO:
      type: object
      properties:
        feeValue:
          type: number
          description: Taxa por transferência via TED
          example: 5
          deprecated: false
        consideredInMonthlyTransfersWithoutFee:
          type: boolean
          description: Indica se a quantidade de transações grátis mensais considera TED
          example: true
          deprecated: false
      description: Taxas para transferências TED
      deprecated: false
    PaymentCheckoutConfigSaveRequestDTO:
      required:
      - logoBackgroundColor
      - infoBackgroundColor
      - fontColor
      type: object
      properties:
        logoBackgroundColor:
          type: string
          description: Cor de fundo do logo
          example: '#00ff00'
          deprecated: false
        infoBackgroundColor:
          type: string
          description: Cor de fundo das suas informações
          example: '#000fff'
          deprecated: false
        fontColor:
          type: string
          description: Cor da fonte das suas informações
          example: '#00ff0'
          deprecated: false
        enabled:
          type: boolean
          description: Indica se a personalização está habilitada
          example: true
          deprecated: false
        logoFile:
          $ref: '#/components/schemas/File'
    AccountInfoGetResponseCustomerTaxRegime:
      type: string
      description: Regime tributário (somente quando Pessoa Jurídica)
      example: NATIONAL_SIMPLE
      deprecated: false
      enum:
      - MEI
      - NATIONAL_SIMPLE
      - NORMAL_REGIME
      - UNKNOWN
    MyAccountGetAccountFeesInvoiceDTO:
      type: object
      properties:
        feeValue:
          type: number
          description: Taxa por nota de serviço emitida
          example: 0.99
          deprecated: false
      description: Taxas de notas fiscais
      deprecated: false
    AccountInfoGetResponseCompanyType:
      type: string
      description: Tipo da empresa (somente quando Pessoa Jurídica)
      example: MEI
      deprecated: false
      enum:
      - MEI
      - LIMITED
      - INDIVIDUAL
      - ASSOCIATION
    MyAccountGetAccountFeesPaymentBankSlipDTO:
      type: object
      properties:
        defaultValue:
          type: number
          description: Taxa por cobrança
          example: 6.96
          deprecated: false
        discountValue:
          type: number
          description: Taxa promocional (Se houver)
          example: 3.99
          deprecated: false
        expirationDate:
          type: string
          description: Data de expiração da taxa promocional (Se houver)
          format: date-time
          example: '2019-05-19 00:00:00'
          deprecated: false
        daysToReceive:
          type: integer
          description: Dias para recebimento da cobrança
          format: int32
          example: 1
          deprecated: false
      description: Taxas de boleto
      deprecated: false
    MyAccountGetAccountFeesAnticipationBankSlipDTO:
      type: object
      properties:
        monthlyFeePercentage:
          type: number
          description: Taxa ao mês para cobranças em boleto
          example: 4.99
          deprecated: false
      description: Tarifa de antecipações em boletos
      deprecated: false
    MyAccountGetAccountFeesPaymentPixDTO:
      type: object
      properties:
        fixedFeeValue:
          type: number
          description: Taxa fixa (Se houver)
          deprecated: false
          example: null
        fixedFeeValueWithDiscount:
          type: number
          description: Taxa fixa promocional (Se houver)
          deprecated: false
          example: null
        percentageFee:
          type: number
          description: Taxa percentual (Se houver)
          example: 0.99
          deprecated: false
        minimumFeeValue:
          type: number
          description: Taxa fixa mínima em caso de taxa percentual
          example: 0.29
          deprecated: false
        maximumFeeValue:
          type: number
          description: Taxa fixa máxima em caso de taxa percentual
          example: 1.99
          deprecated: false
        discountExpiration:
          type: string
          description: Data de expiração da taxa promocional (Se houver)
          format: date-time
          deprecated: false
          example: null
        monthlyCreditsWithoutFee:
          type: integer
          description: Quantidade de transações grátis no mês
          format: int32
          example: 30
          deprecated: false
        creditsReceivedOfCurrentMonth:
          type: integer
          description: Quantas transações já recebeu este mês
          format: int32
          example: 10
          deprecated: false
      description: Taxas de pix
      deprecated: false
    MyAccountGetAccountFeesPaymentDebitCardDTO:
      type: object
      properties:
        operationValue:
          type: number
          description: Taxa operacional por cobrança
          example: 0.35
          deprecated: false
        defaultPercentage:
          type: number
          description: Taxa percentual por cobrança
          example: 1.89
          deprecated: false
        daysToReceive:
          type: integer
          description: Dias para recebimento da cobrança
          format: int32
          example: 3
          deprecated: false
      description: Taxas de cartão de débito
      deprecated: false
    AccountInfoSaveRequestDTO:
      type: object
      properties:
        personType:
          $ref: '#/components/schemas/AccountInfoSaveRequestPersonType'
        cpfCnpj:
          type: string
          description: CPF ou CNPJ do proprietário da conta
          example: '66625514000140'
          deprecated: false
        birthDate:
          type: string
          description: Data de nascimento necessária caso as informações forem de pessoa física
          format: date
          example: '1995-04-12'
          deprecated: false
        companyType:
          $ref: '#/components/schemas/AccountInfoSaveRequestCompanyType'
        companyName:
          type: string
          description: Nome da empresa
          example: ASAAS
          deprecated: false
        incomeValue:
          type: number
          description: Faturamento/Renda mensal
          example: 25000
          deprecated: false
        taxRegime:
          $ref: '#/components/schemas/AccountInfoSaveRequestCustomerTaxRegime'
        email:
          type: string
          description: E-mail da conta
          example: john.doe@asaas.com.br
          deprecated: false
        phone:
          type: string
          description: Telefone
          deprecated: false
          example: null
        mobilePhone:
          type: string
          description: Telefone Celular
          deprecated: false
          example: null
        site:
          type: string
          description: Website
          deprecated: false
          example: null
        postalCode:
          type: string
          description: CEP do endereço
          example: '89223005'
          deprecated: false
        address:
          type: string
          description: Logradouro
          example: Av. Rolf Wiest
          deprecated: false
        addressNumber:
          type: string
          description: Número do endereço
          example: '659'
          deprecated: false
        complement:
          type: string
          description: Complemento do endereço
          deprecated: false
          example: null
        province:
          type: string
          description: Bairro
          example: Bom Retiro
          deprecated: false
    MyAccountGetAccountFeesPaymentDunningDTO:
      type: object
      properties:
        feeValue:
          type: number
          description: Taxa por cobrança
          example: 9.9
          deprecated: false
      description: Taxas de negativação Serasa
      deprecated: false
    AccountInfoGetResponseStatus:
      type: string
      description: Situação da conta
      example: APPROVED
      deprecated: false
      enum:
      - APPROVED
      - AWAITING_ACTION_AUTHORIZATION
      - DENIED
      - PENDING
    MyAccountGetAccountFeesAnticipationDTO:
      type: object
      properties:
        creditCard:
          $ref: '#/components/schemas/MyAccountGetAccountFeesAnticipationCreditCardDTO'
        bankSlip:
          $ref: '#/components/schemas/MyAccountGetAccountFeesAnticipationBankSlipDTO'
      description: Taxas de antecipação
      deprecated: false
    MyAccountGetAccountFeesTransferDTO:
      type: object
      properties:
        monthlyTransfersWithoutFee:
          type: integer
          description: Quantidade de transações grátis mensais
          format: int32
          example: 30
          deprecated: false
        ted:
          $ref: '#/components/schemas/MyAccountGetAccountFeesTransferTedDTO'
        pix:
          $ref: '#/components/schemas/MyAccountGetAccountFeesTransferPixDTO'
      description: Taxas de transferências
      deprecated: false
    MyAccountGetAccountFeesPaymentDTO:
      type: object
      properties:
        bankSlip:
          $ref: '#/components/schemas/MyAccountGetAccountFeesPaymentBankSlipDTO'
        creditCard:
