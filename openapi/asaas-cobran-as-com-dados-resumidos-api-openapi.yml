openapi: 3.2.0
info:
  title: Asaas Cobranças com dados resumidos API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Cobranças com dados resumidos
paths:
  /v3/lean/payments:
    post:
      tags:
      - Cobranças com dados resumidos
      summary: Criar nova cobrança com dados resumidos na resposta
      description: ''
      operationId: criar-nova-cobranca-com-dados-resumidos-na-resposta
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLeanGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_customer
                  description: Customer Inválido ou não informado
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
    get:
      tags:
      - Cobranças com dados resumidos
      summary: Listar cobranças com dados resumidos
      description: ''
      operationId: listar-cobrancas-com-dados-resumidos
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: customer
        in: query
        description: Filtrar pelo Identificador único do cliente
        schema:
          type: string
          example: null
      - name: customerGroupName
        in: query
        description: Filtrar pelo nome do grupo de cliente
        schema:
          type: string
          example: null
      - name: billingType
        in: query
        description: Filtrar por forma de pagamento
        schema:
          $ref: '#/components/schemas/PaymentListRequestBillingType'
      - name: status
        in: query
        description: Filtrar por status
        schema:
          $ref: '#/components/schemas/PaymentListRequestPaymentStatus'
      - name: subscription
        in: query
        description: Filtrar pelo Identificador único da assinatura
        schema:
          type: string
          example: null
      - name: installment
        in: query
        description: Filtrar pelo Identificador único do parcelamento
        schema:
          type: string
          example: null
      - name: externalReference
        in: query
        description: Filtrar pelo Identificador do seu sistema
        schema:
          type: string
          example: null
      - name: paymentDate
        in: query
        description: Filtrar pela data de pagamento
        schema:
          type: string
          example: null
      - name: invoiceStatus
        in: query
        description: Filtro para retornar cobranças que possuem ou não nota fiscal
        schema:
          $ref: '#/components/schemas/PaymentListRequestInvoiceStatus'
      - name: estimatedCreditDate
        in: query
        description: Filtrar pela data estimada de crédito
        schema:
          type: string
          example: null
      - name: pixQrCodeId
        in: query
        description: Filtrar recebimentos originados de um QrCode estático utilizando o id gerado na hora da criação do QrCode
        schema:
          type: string
          example: null
      - name: anticipated
        in: query
        description: Filtrar registros antecipados ou não
        schema:
          type: boolean
          example: null
      - name: anticipable
        in: query
        description: Filtrar registros antecipaveis ou não
        schema:
          type: boolean
          example: null
      - name: dateCreated[ge]
        in: query
        description: Filtrar a partir da data de criação inicial
        schema:
          type: string
          example: null
      - name: dateCreated[le]
        in: query
        description: Filtrar até a data de criação final
        schema:
          type: string
          example: null
      - name: paymentDate[ge]
        in: query
        description: Filtrar a partir da data de recebimento inicial
        schema:
          type: string
          example: null
      - name: paymentDate[le]
        in: query
        description: Filtrar até a data de recebimento final
        schema:
          type: string
          example: null
      - name: estimatedCreditDate[ge]
        in: query
        description: Filtrar a partir da data estimada de crédito inicial
        schema:
          type: string
          example: null
      - name: estimatedCreditDate[le]
        in: query
        description: Filtrar até a data estimada de crédito final
        schema:
          type: string
          example: null
      - name: dueDate[ge]
        in: query
        description: Filtrar a partir da data de vencimento inicial
        schema:
          type: string
          example: null
      - name: dueDate[le]
        in: query
        description: Filtrar até a data de vencimento final
        schema:
          type: string
          example: null
      - name: user
        in: query
        description: Filtrar pelo endereço de e-mail do usuário que criou a cobrança
        schema:
          type: string
          example: null
      - name: checkoutSession
        in: query
        description: Filtrar pelo identificador único da checkout
        schema:
          type: string
          example: null
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLeanListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/lean/payments/:
    post:
      tags:
      - Cobranças com dados resumidos
      summary: Criar cobrança com cartão de crédito com dados resumidos na resposta
      description: ''
      operationId: criar-cobranca-com-cartao-de-credito-com-dados-resumidos-na-resposta
      parameters: []
      requestBody:
