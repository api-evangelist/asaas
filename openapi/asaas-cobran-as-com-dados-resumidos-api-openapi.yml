  /v3/lean/payments/{id}/refund:
    post:
      tags:
      - Cobranças com dados resumidos
      summary: Estornar cobrança com dados resumidos na resposta
      description: ''
      operationId: estornar-cobranca-com-dados-resumidos-na-resposta
      parameters:
      - name: id
        in: path
        description: Identificador único da cobrança no Asaas
        required: true
        schema:
          type: string
          example: null
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRefundRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
