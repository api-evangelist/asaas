      deprecated: false
components:
  schemas:
    PaymentLeanSaveWithCreditCardResponseBillingType:
      type: string
      description: Forma de pagamento
      example: BOLETO
      deprecated: false
      enum:
      - UNDEFINED
      - BOLETO
      - CREDIT_CARD
      - DEBIT_CARD
      - TRANSFER
      - DEPOSIT
      - PIX
    PaymentDiscountDiscountType:
      type: string
      description: Tipo de desconto
      example: PERCENTAGE
      deprecated: false
      enum:
      - FIXED
      - PERCENTAGE
    PaymentInterestResponseDTO:
      type: object
      properties:
        value:
          type: number
          description: Valor dos juros em porcentagem
          example: 2
          deprecated: false
      description: Informações de juros para pagamento após o vencimento
      deprecated: false
    CreditCardRequestDTO:
      required:
      - holderName
      - number
      - expiryMonth
      - expiryYear
      - ccv
      type: object
      properties:
        holderName:
          type: string
          description: Nome impresso no cartão
          example: John Doe
          deprecated: false
        number:
          type: string
          description: Número do cartão
          example: '1234567890123456'
          deprecated: false
        expiryMonth:
          type: string
          description: Mês de expiração com 2 dígitos
          example: '10'
          deprecated: false
        expiryYear:
          type: string
          description: Ano de expiração com 4 dígitos
          example: '2026'
          deprecated: false
        ccv:
          type: string
          description: Código de segurança
          example: '123'
          deprecated: false
      description: Informações do cartão de crédito
      deprecated: false
    PaymentDiscountDTO:
      type: object
      properties:
        value:
          type: number
          description: Valor percentual ou fixo de desconto a ser aplicado sobre o valor da cobrança
          example: 10
          deprecated: false
        dueDateLimitDays:
          type: integer
          description: 'Dias antes do vencimento para aplicar desconto. Ex: 0 = até o vencimento, 1 = até um dia antes, 2 = até dois dias antes, e assim por diante'
          format: int32
          example: 0
          deprecated: false
        type:
          $ref: '#/components/schemas/PaymentDiscountDiscountType'
      description: Informações de desconto
      deprecated: false
    ErrorResponseItemDTO:
      type: object
      properties:
        code:
          type: string
          description: Código do erro
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição do erro
          deprecated: false
          example: null
      description: Lista de objetos
      deprecated: false
    CreditCardThreeDSecureRequestDTO:
      required:
      - callbackUrl
      type: object
      properties:
        callbackUrl:
          type: string
          description: URL para onde o titular do cartão será redirecionado após a conclusão do desafio de autenticação 3D Secure
          example: https://www.example.com/callback/retorno-3ds
          deprecated: false
      description: Dados para habilitar a autenticação 3D Secure na cobrança. Quando informado, o titular do cartão poderá ser direcionado para autenticação junto ao emissor do cartão antes da confirmação do pagamento.
      deprecated: false
    PaymentFineRequestDTO:
      type: object
      properties:
        value:
          type: number
          description: Percentual de multa sobre o valor da cobrança para pagamento após o vencimento
          deprecated: false
          example: null
        type:
          $ref: '#/components/schemas/PaymentFineRequestFineType'
      description: Informações de multa para pagamento após o vencimento
      deprecated: false
    PaymentSaveRequestBillingType:
      type: string
      description: Forma de pagamento
      example: BOLETO
      deprecated: false
      enum:
      - UNDEFINED
      - BOLETO
      - CREDIT_CARD
      - PIX
    PaymentFineRequestFineType:
      type: string
      description: Tipo de multa
      example: FIXED
      deprecated: false
      enum:
      - FIXED
      - PERCENTAGE
    PaymentRefundSplitRequestDTO:
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: Identificador único do split no Asaas
          example: 6fba235c-3726-4e32-b4e6-85f46e10cc2e
          deprecated: false
        value:
          type: number
          description: Valor a ser estornado do split
          example: 2.5
          deprecated: false
      description: Estorno de splits
      deprecated: false
    PaymentRefundRequestDTO:
      type: object
      properties:
        value:
          type: number
          description: Valor total a ser estornado
          example: 5
          deprecated: false
        description:
          type: string
          description: Motivo do estorno
          example: Valor a mais
          deprecated: false
        splitRefunds:
          type: array
          description: Estorno de splits
          deprecated: false
          items:
            $ref: '#/components/schemas/PaymentRefundSplitRequestDTO'
    PaymentLeanSaveWithCreditCardResponseDTO:
      type: object
      properties:
        object:
          type: string
          description: Tipo do objeto
          example: payment
          deprecated: false
        id:
          type: string
          description: Identificador único da cobrança no Asaas
          example: pay_080225913252
          deprecated: false
        dateCreated:
          type: string
          description: Data de criação da cobrança
          format: date
          example: '2017-03-10'
          deprecated: false
        customerId:
          type: string
          description: Identificador único do cliente ao qual a cobrança pertence
          example: cus_G7Dvo4iphUNk
          deprecated: false
        subscriptionId:
          type: string
          description: Identificador único da assinatura (quando cobrança recorrente)
          deprecated: false
          example: null
        installmentId:
          type: string
          description: Identificador único do parcelamento (quando cobrança parcelada)
          deprecated: false
          example: null
        paymentLinkId:
          type: string
          description: Identificador único do link de pagamentos ao qual a cobrança pertence
          deprecated: false
          example: null
        value:
          type: number
          description: Valor da cobrança
          example: 129.9
          deprecated: false
        netValue:
          type: number
          description: Valor líquido da cobrança após desconto da tarifa do Asaas
          example: 124.9
          deprecated: false
        originalValue:
          type: number
          description: Valor original da cobrança (preenchido quando paga com juros e multa)
          deprecated: false
          example: null
        interestValue:
          type: number
          description: Valor calculado de juros e multa que deve ser pago após o vencimento da cobrança
          deprecated: false
          example: null
        description:
          type: string
          description: Descrição da cobrança
          example: Pedido 056984
          deprecated: false
        billingType:
          $ref: '#/components/schemas/PaymentLeanSaveWithCreditCardResponseBillingType'
        canBePaidAfterDueDate:
          type: boolean
