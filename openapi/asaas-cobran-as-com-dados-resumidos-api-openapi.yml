                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
  /v3/lean/payments/{id}:
    get:
      tags:
      - Cobranças com dados resumidos
      summary: Recuperar uma única cobrança com dados resumidos
      description: ''
      operationId: recuperar-uma-unica-cobranca-com-dados-resumidos
      parameters:
      - name: id
        in: path
        description: Identificador único da cobrança no Asaas
        required: true
        schema:
          type: string
          example: null
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLeanGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
    put:
      tags:
      - Cobranças com dados resumidos
      summary: Atualizar cobrança existente com dados resumidos na resposta
      description: ''
      operationId: atualizar-cobranca-existente-com-dados-resumidos-na-resposta
      parameters:
      - name: id
        in: path
        description: Identificador único da cobrança no Asaas
        required: true
        schema:
          type: string
          example: null
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPathIdRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLeanGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
    delete:
      tags:
      - Cobranças com dados resumidos
      summary: Excluir cobrança com dados resumidos
      description: ''
      operationId: excluir-cobranca-com-dados-resumidos
      parameters:
      - name: id
        in: path
        description: Identificador único da cobrança no Asaas
        required: true
        schema:
          type: string
          example: null
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDeleteResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/lean/payments/{id}/captureAuthorizedPayment:
    post:
      tags:
