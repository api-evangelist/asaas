openapi: 3.2.0
info:
  title: Asaas Configurações de Webhooks API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Configurações de Webhooks
paths:
  /v3/webhooks:
    post:
      tags:
      - Configurações de Webhooks
      summary: Criar novo webhook
      description: ''
      operationId: criar-novo-webhook
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfigSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
    get:
      tags:
      - Configurações de Webhooks
      summary: Listar webhooks
      description: Endpoint para listar todos os Webhooks cadastrados na sua conta.
      operationId: listar-webhooks
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/webhooks/{id}:
    get:
      tags:
      - Configurações de Webhooks
      summary: Recuperar um único webhook
      description: Este endpoint recupera um único webhook de acordo com o ID informado.
      operationId: recuperar-um-unico-webhook
      parameters:
      - name: id
        in: path
        description: Identificador único do webhook
        required: true
        schema:
          type: string
          example: bbf67496-1379-4b6d-a348-fd5fa229f1c
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
    put:
      tags:
      - Configurações de Webhooks
      summary: Atualizar webhook existente
      description: Utilize este endpoint para atualizar informações de um webhook já cadastrado.
      operationId: atualizar-webhook-existente
      parameters:
      - name: id
        in: path
        description: Identificador único do Webhook
        required: true
        schema:
          type: string
          example: bbf67496-1379-4b6d-a348-fd5fa229f1c
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfigUpdateRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
    delete:
      tags:
      - Configurações de Webhooks
      summary: Remover um webhook
      description: Este endpoint remove um webhook.
      operationId: remover-webhook
      parameters:
      - name: id
        in: path
        description: Identificador único do webhook
        required: true
        schema:
          type: string
          example: bbf67496-1379-4b6d-a348-fd5fa229f1c
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigDeleteResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/webhooks/{id}/removeBackoff:
    post:
      tags:
      - Configurações de Webhooks
      summary: Remover penalização de webhook
      description: Utilize este endpoint para remover a penalização de todos os webhooks penalizados de uma configuração.
      operationId: remover-penalizacao-webhook
      parameters:
      - name: id
        in: path
        description: Identificador único da configuração de webhook
        required: true
        schema:
          type: string
          example: bbf67496-1379-4b6d-a348-fd5fa229f1ca
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebHookConfigRemoveBackoffRequestDTO'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
