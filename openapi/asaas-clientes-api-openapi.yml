openapi: 3.2.0
info:
  title: Asaas Clientes API
  description: API pública de integração com a plataforma Asaas.
  version: 3.0.0
servers:
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- Authorization: []
tags:
- name: Clientes
paths:
  /v3/customers:
    post:
      tags:
      - Clientes
      summary: Criar novo cliente
      description: ''
      operationId: criar-novo-cliente
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSaveRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
      deprecated: false
    get:
      tags:
      - Clientes
      summary: Listar clientes
      description: ''
      operationId: listar-clientes
      parameters:
      - name: offset
        in: query
        description: Elemento inicial da lista
        schema:
          type: integer
          example: 0
      - name: limit
        in: query
        description: 'Número de elementos da lista (max: 100)'
        schema:
          maximum: 100
          type: integer
          example: 10
      - name: name
        in: query
        description: Filtrar por nome
        schema:
          type: string
          example: John Doe
      - name: email
        in: query
        description: Filtrar por email
        schema:
          type: string
          example: john.doe@asaas.com.br
      - name: cpfCnpj
        in: query
        description: Filtrar por CPF ou CNPJ
        schema:
          type: string
          example: '24971563792'
      - name: groupName
        in: query
        description: Filtrar por grupo
        schema:
          type: string
          example: null
      - name: externalReference
        in: query
        description: Filtrar pelo Identificador do seu sistema
        schema:
          type: string
          example: null
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
      deprecated: false
  /v3/customers/{id}:
    get:
      tags:
      - Clientes
      summary: Recuperar um único cliente
      description: ''
      operationId: recuperar-um-unico-cliente
      parameters:
      - name: id
        in: path
        description: Identificador único do cliente no Asaas
        required: true
        schema:
          type: string
          example: cus_000005401844
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
    put:
      tags:
      - Clientes
      summary: Atualizar cliente existente
      description: ''
      operationId: atualizar-cliente-existente
      parameters:
      - name: id
        in: path
        description: Identificador único do cliente a ser atualizado
        required: true
        schema:
          type: string
          example: cus_000005401844
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
    delete:
      tags:
      - Clientes
      summary: Remover cliente
      description: ''
      operationId: remover-cliente
      parameters:
      - name: id
        in: path
        description: Identificador único do cliente a ser removido.
        required: true
        schema:
          type: string
          example: cus_000005401844
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDeleteResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
  /v3/customers/{id}/notifications:
    get:
      tags:
      - Clientes
      summary: Recuperar notificações de um cliente
      description: ''
      operationId: recuperar-notificacoes-de-um-cliente
      parameters:
      - name: id
        in: path
        description: Identificador único do cliente no Asaas
        required: true
        schema:
          type: string
          example: cus_000005401844
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '403':
          description: Forbidden. Ocorre quando o body da requisição está preenchido, chamadas de método GET precisam ter um body vazio.
        '404':
          description: Not found
      deprecated: false
  /v3/customers/{id}/restore:
    post:
      tags:
      - Clientes
      summary: Restaurar cliente removido
      description: ''
      operationId: restaurar-cliente-removido
      parameters:
      - name: id
        in: path
        description: Identificador único do cliente a ser restaurado.
        required: true
        schema:
          type: string
          example: cus_000005401844
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRestoreRequestDTO'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGetResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: error_code
                  description: Descrição do erro
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                errors:
                - code: invalid_access_token
                  description: A chave de API fornecida é inválida
        '404':
          description: Not found
      deprecated: false
components:
  schemas:
    CustomerRestoreRequestDTO:
      type: object
      properties: {}
    CustomerUpdateRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: Nome do cliente
          example: John Doe
          deprecated: false
        cpfCnpj:
          type: string
          description: CPF ou CNPJ do cliente
          example: '24971563792'
          deprecated: false
        email:
          type: string
          description: Email do cliente
          example: john.doe@asaas.com.br
          deprecated: false
        phone:
          type: string
          description: Fone fixo
          example: '4738010919'
          deprecated: false
        mobilePhone:
          type: string
          description: Fone celular
          example: '4799376637'
          deprecated: false
        address:
          type: string
          description: Logradouro
          example: Av. Paulista
          deprecated: false
        addressNumber:
          type: string
          description: Número do endereço
          example: '150'
          deprecated: false
        complement:
          type: string
          description: Complemento do endereço
          example: Sala 201
          deprecated: false
        province:
          type: string
          description: Bairro
          example: Centro
          deprecated: false
        postalCode:
          type: string
          description: CEP do endereço
          example: 01310-000
          deprecated: false
        externalReference:
          type: string
          description: Identificador do cliente no seu sistema
          example: '12987382'
          deprecated: false
        notificationDisabled:
          type: boolean
          description: true para desabilitar o envio de notificações de cobrança
          example: false
          deprecated: false
        additionalEmails:
          type: string
          description: Emails adicionais para envio de notificações de cobrança separados por ","
          example: john.doe@asaas.com,john.doe.silva@asaas.com.br
          deprecated: false
        municipalInscription:
          type: string
          description: Inscrição municipal do cliente
          example: '46683695908'
          deprecated: false
        stateInscription:
          type: string
          description: Inscrição estadual do cliente
          example: '646681195275'
          deprecated: false
        observations:
          type: string
          description: Observações adicionais
          example: ótimo pagador, nenhum problema até o momento
          deprecated: false
        groupName:
          type: string
          description: Nome do grupo ao qual o cliente pertence. Para associar o cliente a mais de um grupo, utilize o atributo "groupNames"
          deprecated: false
          example: null
        groupNames:
          type: array
          description: Lista de nomes dos grupos aos quais o cliente pertence (máximo de 20 por chamada). Pode ser utilizado em conjunto com "groupName"
          example:
          - Grupo A
          - Grupo B
          deprecated: false
          items:
            type: string
            description: Lista de nomes dos grupos aos quais o cliente pertence (máximo de 20 por chamada). Pode ser utilizado em conjunto com "groupName"
            example:
            - Grupo A
            - Grupo B
            deprecated: false
        company:
          type: string
          description: Empresa
          deprecated: false
          example: null
        foreignCustomer:
          type: boolean
          description: informe true caso seja pagador estrangeiro
          example: false
          deprecated: false
    CustomerDeleteResponseDTO:
      type: object
      properties:
        deleted:
          type: boolean
          description: Indica se o cliente foi removido
          example: true
          deprecated: false
        id:
          type: string
          description: Identificador único do cliente
          example: cus_000005401844
          deprecated: false
    CustomerSaveRequestDTO:
