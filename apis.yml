    url: https://docs.asaas.com/reference/criar-novo-cliente
- aid: asaas:charges
  name: Asaas Charges (Cobranças) API
  description: >-
    Core billing endpoint for creating individual charges payable by Boleto, Pix, Credit Card, Debit Card,
    or "undefined" (let the payer choose). Supports capture, refund, partial refund, anticipation, fine
    and interest configuration, discount rules, due-date updates, and status retrieval.
  humanURL: https://docs.asaas.com/reference/criar-nova-cobranca
