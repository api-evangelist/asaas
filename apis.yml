  name: Asaas Customers API
  description: >-
    Create, retrieve, update, list, and delete customers ("clientes"). The Customer object holds personal/business
    identifiers (CPF/CNPJ), contact details, address, default notification preferences, and Serasa-reporting
    configuration; it is the parent entity for charges, subscriptions, and installments.
  humanURL: https://docs.asaas.com/reference/criar-novo-cliente
  baseURL: https://api.asaas.com/v3
